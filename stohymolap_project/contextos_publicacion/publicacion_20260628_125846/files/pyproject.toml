[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stohymolap"
version = "0.1.0"
description = "StoHyMoLAP / RAMIS rainfall-runoff experimental framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "tabulate>=0.9",
]

[project.optional-dependencies]
ml = [
  "xgboost>=2.0",
  "tensorflow>=2.13",
  "torch>=2.0",
]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
